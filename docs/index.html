<!DOCTYPE html>
<html lang="en-us">
	<head>
		<meta charset="utf-8">
			<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
				<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
					<title>Unity Web Player | Math Shooter</title>
					<style>
						* { margin: 0; padding: 0; box-sizing: border-box; }
						html, body {
						width: 100%;
						height: 100%;
						overflow: hidden;
						background: #000;
						font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
						}
						#unity-container {
						position: fixed;
						top: 0; left: 0;
						width: 100%; height: 100%;
						display: flex;
						align-items: center;
						justify-content: center;
						background: #000;
						}
						#unity-canvas {
						display: block;
						background: #000;
						max-width: 100vw !important;
						max-height: 100vh !important;
						}
						#unity-footer,
						#unity-fullscreen-button,
						#unity-logo-title-footer,
						#unity-build-title {
						display: none !important;
						}
						#custom-fullscreen-btn {
						position: fixed;
						top: 12px;
						right: 12px;
						z-index: 9999;
						width: 40px;
						height: 40px;
						border-radius: 8px;
						border: none;
						background: rgba(0, 0, 0, 0.55);
						color: #fff;
						display: flex;
						align-items: center;
						justify-content: center;
						cursor: pointer;
						}
						#custom-fullscreen-btn:hover { background: rgba(0, 0, 0, 0.8); }
						#custom-fullscreen-btn svg {
						width: 20px; height: 20px;
						fill: none; stroke: #fff; stroke-width: 2;
						}
						#custom-fullscreen-btn.destacar::before {
						content: "";
						position: absolute;
						inset: -6px;
						border-radius: 12px;
						border: 2px solid #ff6a00;
						animation: pulsar-anel 1.6s ease-out infinite;
						pointer-events: none;
						}
						@keyframes pulsar-anel {
						0% { transform: scale(0.9); opacity: 0.9; }
						70% { transform: scale(1.6); opacity: 0; }
						100% { transform: scale(1.6); opacity: 0; }
						}
						#fullscreen-hint {
						position: fixed;
						top: 58px;
						right: 12px;
						z-index: 9998;
						display: flex;
						align-items: flex-start;
						gap: 6px;
						opacity: 0;
						transform: translateY(-6px);
						pointer-events: none;
						transition: opacity 0.4s ease, transform 0.4s ease;
						}
						#fullscreen-hint.visivel {
						opacity: 1;
						transform: translateY(0);
						pointer-events: auto;
						}
						#fullscreen-hint-arrow {
						width: 22px;
						height: 22px;
						flex-shrink: 0;
						color: #ff6a00;
						animation: apontar 1.2s ease-in-out infinite;
						}
						@keyframes apontar {
						0%, 100% { transform: translateY(0) rotate(-25deg); }
						50% { transform: translateY(-4px) rotate(-25deg); }
						}
						#fullscreen-hint-text {
						background: rgba(0, 0, 0, 0.75);
						color: #fff;
						font-size: 12px;
						font-weight: 600;
						line-height: 1.35;
						padding: 8px 10px;
						border-radius: 8px;
						max-width: 150px;
						cursor: pointer;
						}
						#rotate-overlay {
						position: fixed;
						inset: 0;
						z-index: 30;
						background: rgba(0, 0, 0, 0.94);
						display: none;
						flex-direction: column;
						align-items: center;
						justify-content: center;
						gap: 18px;
						text-align: center;
						padding: 24px;
						}
						#rotate-overlay.ativo { display: flex; }
						#rotate-icon {
						width: 64px;
						height: 64px;
						color: #ff6a00;
						animation: balancar 1.4s ease-in-out infinite;
						}
						@keyframes balancar {
						0%, 100% { transform: rotate(0deg); }
						50% { transform: rotate(-90deg); }
						}
						#rotate-text {
						color: #fff;
						font-size: 16px;
						font-weight: 600;
						max-width: 260px;
						line-height: 1.4;
						}
					</style>
				</head>
	<body>
		<div id="unity-container">
			<canvas id="unity-canvas" tabindex="-1"></canvas>
			<div id="unity-warning"></div>
			<div id="unity-footer" style="display:none">
				<div id="unity-logo-title-footer"></div>
				<div id="unity-fullscreen-button"></div>
				<div id="unity-build-title">Math Shooter</div>
			</div>
		</div>

		<div id="rotate-overlay">
			<svg id="rotate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
				<rect x="6" y="2" width="12" height="20" rx="2.5"></rect>
				<line x1="11" y1="19" x2="13" y2="19" stroke-width="2" stroke-linecap="round"></line>
			</svg>
			<div id="rotate-text">Gire seu celular para a horizontal para jogar</div>
		</div>

		<button id="custom-fullscreen-btn" title="Tela cheia">
			<svg viewBox="0 0 24 24">
				<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
			</svg>
		</button>

		<div id="fullscreen-hint">
			<svg id="fullscreen-hint-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<line x1="19" y1="5" x2="7" y2="17"></line>
				<polyline points="7 8 7 17 16 17"></polyline>
			</svg>
			<div id="fullscreen-hint-text">Toque aqui para jogar em tela cheia</div>
		</div>

		<script>
			var canvas = document.querySelector("#unity-canvas");

			function redimensionar() {
			var larguraJanela = window.innerWidth;
			var alturaJanela = window.innerHeight;
			var proporcao = 1920 / 1080;

			var largura, altura;
			if (larguraJanela / alturaJanela > proporcao) {
			altura = alturaJanela;
			largura = Math.floor(altura * proporcao);
			} else {
			largura = larguraJanela;
			altura = Math.floor(largura / proporcao);
			}

			largura = Math.min(largura, larguraJanela);
			altura = Math.min(altura, alturaJanela);

			canvas.style.width = largura + "px";
			canvas.style.height = altura + "px";
			}

			window.addEventListener("resize", redimensionar);
			redimensionar();

			function unityShowBanner(msg, type) {
			var warningBanner = document.querySelector("#unity-warning");
			function updateBannerVisibility() {
			warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
			}
			var div = document.createElement('div');
			div.innerHTML = msg;
			warningBanner.appendChild(div);
			if (type == 'error') div.style = 'background: red; padding: 10px;';
			else {
			if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
			setTimeout(function() {
			warningBanner.removeChild(div);
			updateBannerVisibility();
			}, 5000);
			}
			updateBannerVisibility();
			}

			var isMobile = /iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
			var rotateOverlay = document.querySelector("#rotate-overlay");

			function checarOrientacao() {
			if (!isMobile) return;
			var retrato = window.innerHeight > window.innerWidth;
			rotateOverlay.classList.toggle("ativo", retrato);
			}

			window.addEventListener("resize", checarOrientacao);
			window.addEventListener("orientationchange", checarOrientacao);
			checarOrientacao();

			var buildUrl = "Build";
			var loaderUrl = buildUrl + "/docs.loader.js";
			var config = {
			arguments: [],
			dataUrl: buildUrl + "/docs.data",
			frameworkUrl: buildUrl + "/docs.framework.js",
			codeUrl: buildUrl + "/docs.wasm",
			streamingAssetsUrl: "StreamingAssets",
			companyName: "UTFPR",
			productName: "Math Shooter",
			productVersion: "1.0",
			showBanner: unityShowBanner,
			};

			var script = document.createElement("script");
			script.src = loaderUrl;
			script.onload = () => {
			createUnityInstance(canvas, config, (progress) => {
			}).then((unityInstance) => {

			// Envia se é mobile
			if (isMobile) {
			unityInstance.SendMessage("MobileUI", "SetMobileFromJS", "1");
			}

			// ← CORREÇÃO: envia o devicePixelRatio real do navegador
			var dpr = (window.devicePixelRatio || 1).toFixed(4);
			unityInstance.SendMessage("MobileUI", "SetDevicePixelRatioFromJS", dpr.toString());

			}).catch((message) => {
			alert(message);
			});
			};

			document.body.appendChild(script);

			document.querySelector("#custom-fullscreen-btn").addEventListener("click", function () {
			var el = document.querySelector("#unity-container");
			if (!document.fullscreenElement) {
			if (el.requestFullscreen) el.requestFullscreen();
			else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
			} else {
			if (document.exitFullscreen) document.exitFullscreen();
			else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
			}
			});

			var botaoTelaCheia = document.querySelector("#custom-fullscreen-btn");
			var dicaTelaCheia = document.querySelector("#fullscreen-hint");
			var textoDicaTelaCheia = document.querySelector("#fullscreen-hint-text");
			var timeoutEsconderDica;

			var armazenamentoOk = true;
			try {
			sessionStorage.setItem("mathshooter-teste", "1");
			sessionStorage.removeItem("mathshooter-teste");
			} catch (e) { armazenamentoOk = false; }

			function jaViuDica() {
			if (!armazenamentoOk) return window.__mathshooterJaViuDica === true;
			try { return sessionStorage.getItem("mathshooter-dica-tela-cheia") === "1"; }
			catch (e) { return window.__mathshooterJaViuDica === true; }
			}

			function marcarDicaVista() {
			window.__mathshooterJaViuDica = true;
			if (!armazenamentoOk) return;
			try { sessionStorage.setItem("mathshooter-dica-tela-cheia", "1"); }
			catch (e) {}
			}

			function esconderDica() {
			dicaTelaCheia.classList.remove("visivel");
			botaoTelaCheia.classList.remove("destacar");
			clearTimeout(timeoutEsconderDica);
			}

			function mostrarDica() {
			if (jaViuDica() || document.fullscreenElement) return;
			dicaTelaCheia.classList.add("visivel");
			botaoTelaCheia.classList.add("destacar");
			marcarDicaVista();
			timeoutEsconderDica = setTimeout(esconderDica, 6000);
			}

			textoDicaTelaCheia.addEventListener("click", function () { botaoTelaCheia.click(); });
			dicaTelaCheia.addEventListener("click", esconderDica);
			botaoTelaCheia.addEventListener("click", esconderDica);
			document.addEventListener("fullscreenchange", function () {
			if (document.fullscreenElement) esconderDica();
			});

			if (!isMobile) {
			setTimeout(mostrarDica, 1500);
			} else {
			var jaMostrouNoMobile = false;
			window.addEventListener("resize", function () {
			if (!jaMostrouNoMobile && window.innerWidth > window.innerHeight) {
			jaMostrouNoMobile = true;
			setTimeout(mostrarDica, 1000);
			}
			});
			window.addEventListener("orientationchange", function () {
			if (!jaMostrouNoMobile && window.innerWidth > window.innerHeight) {
			jaMostrouNoMobile = true;
			setTimeout(mostrarDica, 1000);
			}
			});
			}
		</script>
	</body>
</html>
